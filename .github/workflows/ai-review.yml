# ─── AI PR Review Workflow ───
# Triggers AI code review on every pull request.
# Uses the reusable workflow from nilesh32236/opencode-ai-reviewer@v1.

name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review (leave empty for latest)'
        required: false
        type: number

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # Trigger on: PR events (skip bot PRs), /review comment on PR, or manual dispatch
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.actor != 'github-actions[bot]' &&
        !contains(github.event.pull_request.labels.*.name, 'autofix')
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '/review')
      )
    uses: nilesh32236/opencode-ai-reviewer/.github/workflows/review.yml@v1
    with:
      model: 'opencode/deepseek-v4-flash-free'
      max_files_per_batch: 3
      include_strengths: true
      project_context: 'React 19 + TypeScript + Vite 6 + Tailwind CSS v4. Marketing/portfolio site. No test framework.'
    secrets:
      repo_token: ${{ secrets.GITHUB_TOKEN }}

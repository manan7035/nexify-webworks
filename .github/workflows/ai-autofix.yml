# ─── AI Autofix Workflow ───
# Triggers when an issue is labeled 'ai-audit-fix'.
# AI creates a branch, applies fixes, runs checks, and opens a PR.
# Uses the composite action nilesh32236/opencode-ai-reviewer@v1 directly.

name: AI Autofix

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to fix'
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ai-autofix-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  autofix:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'ai-audit-fix') ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '/fix') &&
       github.event.issue.pull_request == null) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/fix')) ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.event.issue.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: AI Fix
        id: ai-fix
        uses: nilesh32236/opencode-ai-reviewer@v1
        with:
          mode: fix
          model: 'opencode/deepseek-v4-flash-free'
          max_fix_iterations: 3
          run_checks_after_fix: 'npm run build && npm run lint'
          github_token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        # Note: The upstream action handles branch creation, commit, push, and PR creation
        # automatically. No additional steps are needed.
        #
        # IMPORTANT: The built-in GITHUB_TOKEN may lack PR creation permissions in some repos.
        # Add a GH_PAT secret (repo scope) to enable automatic PR creation:
        #   gh secret set GH_PAT --body "your-personal-access-token"

# ─── AI Autofix Workflow ───
# Triggers when an issue is labeled 'ai-audit-fix'.
# AI creates a branch, applies fixes, runs checks, and opens a PR.
# Uses the composite action nilesh32236/opencode-ai-reviewer@v1 directly.

name: AI Autofix

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ai-autofix-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  autofix:
    if: github.event.label.name == 'ai-audit-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: AI Fix
        id: ai-fix
        uses: nilesh32236/opencode-ai-reviewer@v1
        with:
          mode: fix
          model: 'opencode/deepseek-v4-flash-free'
          max_fix_iterations: 3
          run_checks_after_fix: 'npm run build && npm run lint'
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Fix PR
        if: steps.ai-fix.outputs.changes_made == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Fetch issue title safely via gh API (avoids shell injection from ${{ }} interpolation)
          ISSUE_TITLE=$(gh api repos/${{ github.repository }}/issues/${ISSUE_NUMBER} --jq '.title')
          # Safe branch slug: lowercase, strip to [a-z0-9-] only, truncate to 40 chars
          BRANCH_SLUG=$(echo "${ISSUE_TITLE}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//' | head -c 40)
          BRANCH="ai-autofix/${ISSUE_NUMBER}-${BRANCH_SLUG}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "fix: auto-fix for issue #${ISSUE_NUMBER} - ${ISSUE_TITLE}"
          git push origin "$BRANCH"
          # Use --body-file to avoid \n literal rendering and shell quoting issues
          BODY_FILE=$(mktemp)
          cat > "$BODY_FILE" <<EOF
          This PR was automatically generated to fix issue #${ISSUE_NUMBER}.

          **Changes:** Applied by OpenCode AI Reviewer.
          **Checks:** \`npm run build\` and \`npm run lint\` passed.

          Please review carefully before merging.
          EOF
          gh pr create \
            --title "Auto-fix for #${ISSUE_NUMBER}: ${ISSUE_TITLE}" \
            --body-file "$BODY_FILE" \
            --label "autofix" \
            --base ${{ github.event.repository.default_branch }} \
            --head "$BRANCH"
          rm -f "$BODY_FILE"
